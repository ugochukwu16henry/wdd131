<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Building Stronger Families — Resources</title>
    <link rel="stylesheet" href="/wdd131/style/project.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">
    <meta name="description"
        content="Browse communication exercises, parenting tips, conflict resolution guides, and family bonding activities.">
</head>

<body>
    <header>
        <nav class="site-nav container" role="navigation" aria-label="Main">
            <div class="nav-left">
                <a class="logo" href="index.html"><span class="site-name">Building Stronger Families</span></a>
            </div>
            <ul class="nav-right" role="menubar">
                <li role="none"><a role="menuitem" href="index.html">Home</a></li>
                <li role="none"><a role="menuitem" href="resources.html" class="active">Resources</a></li>
                <li role="none"><a role="menuitem" href="about.html">About</a></li>
                <li role="none"><a role="button" href="#subscribe" class="donate">Donate</a></li>
            </ul>
        </nav>
    </header>

    <main class="container resources-page" role="main">
        <!-- Sidebar (250px) -->
        <aside class="sidebar" aria-labelledby="filter-title">
            <h3 id="filter-title">Search & Categories</h3>
            <label for="searchInput" class="sr-only">Search resources</label>
            <input id="searchInput" type="search" placeholder="Search resources..." aria-controls="resourceGrid">

            <h4>Categories</h4>
            <ul class="category-list" id="categoryList">
                <li><button class="cat-btn" data-cat="all">All</button></li>
                <li><button class="cat-btn" data-cat="communication">Communication</button></li>
                <li><button class="cat-btn" data-cat="parenting">Parenting</button></li>
                <li><button class="cat-btn" data-cat="conflict">Conflict Resolution</button></li>
                <li><button class="cat-btn" data-cat="activities">Family Activities</button></li>
            </ul>
        </aside>

        <!-- Resource grid -->
        <section class="resource-grid" id="resourceGrid" aria-live="polite" aria-label="Resource results">
            <!-- populated by JS -->
        </section>
    </main>

    <footer>
        <div class="container footer-inner">
            <p>© <span id="year2"></span> Building Stronger Families — <a href="references.html">References</a></p>
        </div>
    </footer>

    <script src="/wdd131/scripts/app.js" defer></script>
</body>

</html>
